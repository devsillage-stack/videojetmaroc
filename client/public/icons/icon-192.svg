  <text x="96" y="102" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">VJ</text>
  <!-- Industrial dots for CIJ drops -->
  <circle cx="56" cy="116" r="4" fill="#00D26A"/>
  <circle cx="70" cy="116" r="4" fill="#00D26A"/>
