      <stop offset="0%" stop-color="#002B49"/>
      <stop offset="100%" stop-color="#071927"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C00"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
